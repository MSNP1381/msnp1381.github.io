# Replace .github/workflows/pages-deploy.yml in MSNP1381/msnp1381.github.io.
name: Build portfolio and blog
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure blog subpath
        run: node portfolio/deployment/github-pages/configure-blog.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Rebuild Chirpy JavaScript for /blog/
        # This repository has no root package-lock.json. Keep the existing theme tooling.
        run: |
          npm install --no-package-lock
          npm run build:js
        env:
          HUSKY: "0"
      - name: Build Jekyll blog
        run: bundle exec jekyll build --baseurl /blog --destination _site/blog
        env:
          JEKYLL_ENV: production
      - name: Build React portfolio
        run: |
          npm ci --prefix portfolio
          npm run build --prefix portfolio
        env:
          VITE_BLOG_BASE_URL: /blog/
      - name: Assemble site and legacy redirects
        run: node portfolio/deployment/github-pages/assemble.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish combined site
        id: deployment
        uses: actions/deploy-pages@v4
